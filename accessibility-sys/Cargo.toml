[package]
name = "accessibility-sys"
version = "0.3.0"
authors = ["Mack Straight <mack@discordapp.com>"]
edition = "2021"
license = "MIT / Apache-2.0"
homepage = "https://github.com/eiz/accessibility"
repository = "https://github.com/eiz/accessibility"
description = "Bindings for macOS Accessibility services"

[dependencies]
libc = "0.2"

[dependencies.objc2-core-foundation]
version = "0.3.2"
default-features = false
features = ["std"]

[dependencies.objc2-application-services]
version = "0.3.2"
default-features = false
features = [
    "std",
    "libc",
    "HIServices",
    "AXAttributeConstants",
    "AXConstants",
    "AXError",
    "AXNotificationConstants",
    "AXTextAttributedString",
    "AXUIElement",
    "AXValue",
]

[package.metadata.docs.rs]
default-target = "x86_64-apple-darwin"
